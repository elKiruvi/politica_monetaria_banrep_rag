# Configuración en .env (ver .env.example): BANREP_UID, BANREP_GID, BANREP_DATOS y la URL de Ollama.
#   docker compose up -d                       Ollama instalado en el equipo (ver ADR 0014, Linux)
#   docker compose --profile ollama up -d      Ollama en contenedor, CPU
#   docker compose --profile ollama-gpu up -d  Ollama en contenedor, GPU NVIDIA
# Con Ollama en contenedor: BANREP_DOCKER_OLLAMA_URL=http://ollama:11434
services:
  banrep-rag:
    build: .
    image: banrep-rag:local
    user: "${BANREP_UID:-10001}:${BANREP_GID:-10001}"
    ports:
      - "127.0.0.1:8000:8000" # solo en este equipo
    volumes:
      - ${BANREP_DATOS:-./data/catalogo}:/datos
    environment:
      # Variable propia: una BANREP_OLLAMA_URL del equipo (p. ej. 127.0.0.1) no sirve dentro.
      BANREP_OLLAMA_URL: ${BANREP_DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      BANREP_OLLAMA_LOCAL_HOSTS: ${BANREP_DOCKER_OLLAMA_LOCAL_HOSTS:-host.docker.internal,ollama}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped

  # Sin puerto publicado: banrep-rag lo usa por la red interna y los modelos se descargan con
  # «docker compose exec». Así no choca con un Ollama ya instalado en el equipo.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.33.2
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  ollama-gpu:
    profiles: ["ollama-gpu"]
    image: ollama/ollama:0.33.2
    volumes:
      - ollama:/root/.ollama
    networks:
      default:
        aliases: [ollama] # misma URL http://ollama:11434 que el perfil de CPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama:
