[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "politica-monetaria-banrep-rag"
version = "0.1.0"
description = "Exploración local y verificable de informes de política monetaria"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "pdfminer.six>=20250506,<20270101",
    "pypdf>=6,<7",
]

[project.scripts]
banrep-rag = "politica_monetaria_banrep_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "pre-commit>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/politica_monetaria_banrep_rag"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
