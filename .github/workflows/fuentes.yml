name: Diagnóstico de fuentes
# Comprueba desde un runner de GitHub (otra IP) el acceso a Crossref, al histórico y al
# repositorio del Banco. No es un check de PR: una caída externa no debe bloquear cambios.
on:
  workflow_dispatch:
    inputs:
      descargar_uno:
        description: "Descargar y verificar el PDF más reciente (se elimina al terminar)"
        type: boolean
        default: false
  schedule:
    - cron: "23 12 * * 1" # lunes 12:23 UTC (07:23 en Colombia)
permissions:
  contents: read
concurrency:
  group: diagnostico-fuentes
  cancel-in-progress: false
jobs:
  diagnostico:
    name: Diagnóstico de fuentes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Ejecutar diagnóstico
        env:
          DESCARGAR_UNO: ${{ inputs.descargar_uno }}
        run: |
          args=(--json)
          if [ "$DESCARGAR_UNO" = "true" ]; then args+=(--descargar-uno); fi
          uv run --frozen banrep-rag diagnostico-fuentes "${args[@]}" > diagnostico.json
      - name: Resumen
        if: always()
        run: |
          if [ ! -s diagnostico.json ]; then echo "El diagnóstico no produjo resultados." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          uv run --frozen python -c "import json; from politica_monetaria_banrep_rag.diagnostics import render; print(render(json.load(open('diagnostico.json'))))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-fuentes
          path: diagnostico.json
          retention-days: 30
